{% extends "base.html" %}
{% block content %}<div class="card form-narrow"><h2>Set a new password</h2>
{% if validlink %}<form method="post">{% csrf_token %}
{% for f in form %}<label>{{ f.label }}</label>{{ f }}{{ f.errors }}{% endfor %}
<button class="btn btn-block" style="margin-top:16px">Change password</button></form>
{% else %}<p class="help">This reset link is invalid or expired.</p>{% endif %}</div>{% endblock %}
