{% extends "base.html" %}
{% block content %}
<div class="card form-narrow">
  <h2>Reset password</h2>
  <p class="help">Enter your email. A reset link will be generated (printed to the server console in dev).</p>
  <form method="post">{% csrf_token %}
    {% for f in form %}<label>{{ f.label }}</label>{{ f }}{{ f.errors }}{% endfor %}
    <button class="btn btn-block" style="margin-top:16px">Send reset link</button>
  </form>
</div>
{% endblock %}
